name: Generate NBA Article from Issue

on:
  issues:
    types: [opened, edited]

jobs:
  generate-article:
    # "article-request" ラベルが付いているIssueのみ処理
    if: contains(github.event.issue.labels.*.name, 'article-request')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          GITHUB_OUTPUT: ${{ github.output }}
        id: generate
        run: |
          python scripts/generate_article.py

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Commit and push article
        run: |
          git add articles/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add article: ${{ github.event.issue.title }}"
            git push
          fi

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // 最新の記事ファイルを探す
            const articlesDir = 'articles';
            const files = fs.readdirSync(articlesDir)
              .filter(file => file.endsWith('.md'))
              .map(file => ({
                name: file,
                time: fs.statSync(path.join(articlesDir, file)).mtime.getTime()
              }))
              .sort((a, b) => b.time - a.time);

            const latestArticle = files.length > 0 ? files[0].name : 'unknown';
            const articlePath = `articles/${latestArticle}`;

            const message = `✅ 記事を生成しました！

📝 **ファイル**: \`${articlePath}\`

生成された記事は自動的にコミットされました。
[記事を確認する](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/${articlePath})

このIssueをクローズしても構いません。`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
